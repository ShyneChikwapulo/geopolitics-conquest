services:
  - type: web
    name: geopolitics-conquest
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: packages/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_USER
        value: student
      - key: VITE_APP_PASS
        value: inf4001n
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_OPENROUTER_KEY
        sync: false