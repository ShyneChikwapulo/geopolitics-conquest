services:
  - type: web
    name: geopolitics-conquest
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: packages/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Only PUBLIC web configuration belongs here: everything with a VITE_ prefix is compiled into the
    # JavaScript that every visitor downloads. Firebase's web config is designed to be public; access is
    # enforced by firestore.rules. Never put a secret in a VITE_ variable.
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Optional AI features. Point this at the proxy in infra/llm-proxy so the OpenRouter key stays server-side.
      - key: VITE_LLM_PROXY_URL
        sync: false
      - key: VITE_LLM_MODEL
        sync: false
